# Server Configuration
server.port=8080
server.servlet.context-path=/

# ─── MySQL Database Configuration ─────────────────────────────────────────────
# Update the values below to match your MySQL setup.
# You can also override them with environment variables or a .env file.
spring.datasource.url=jdbc:mysql://localhost:3306/quiz_generator_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=raunak@05
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Schema initialisation — run schema.sql on startup
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# OpenAI / Groq / OpenRouter API Configuration
openai.api.key=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

openai.base.url=https://api.groq.com/openai/v1/
openai.model=llama-3.1-8b-instant
openai.max.tokens=2000

# Application Configuration
app.upload.dir=uploads
app.quiz.default.questions=10
app.quiz.fallback.enabled=true

# Quiz Generation Performance Tuning
app.quiz.async.core-pool-size=4
app.quiz.async.max-pool-size=8
app.quiz.async.queue-capacity=200
app.quiz.chunk.max.chars=3000
app.quiz.chunk.overlap.chars=250
app.quiz.ai.chunk.parallelism=2
app.quiz.ai.max.retries=3
app.quiz.ai.retry.delay.ms=1200
app.quiz.ai.temperature=0.5

# Logging Configuration
logging.level.com.quizgen=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
